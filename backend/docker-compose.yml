services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: vacation
      POSTGRES_DB: vacation
    ports:
      - "5432:5432"
    volumes:
      - vacation_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vacation_db_data:

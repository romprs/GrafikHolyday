# Устанавливается install.sh в /etc/nginx/conf.d/vacation-planner.conf ВМЕСТО
# nginx-vacation.conf — когда install.sh запущен с TLS_PFX_PATH (см. README,
# раздел "HTTPS через корпоративный сертификат"). Плейсхолдер __INSTALL_DIR__
# подставляется автоматически; сертификат и ключ install.sh кладёт в
# __INSTALL_DIR__/tls/server.crt и server.key (конвертированы из .pfx через
# openssl при установке — nginx не умеет читать PKCS#12 напрямую).

server {
    listen 80 default_server;
    server_name _;
    # Только редирект на HTTPS — сама раздача только через 443.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     __INSTALL_DIR__/tls/server.crt;
    ssl_certificate_key __INSTALL_DIR__/tls/server.key;

    root __INSTALL_DIR__/frontend-dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # SPA: неизвестные пути отдаём index.html, роутинг на стороне React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Устанавливается install.sh в /etc/nginx/conf.d/vacation-planner.conf
# (плейсхолдер __INSTALL_DIR__ подставляется автоматически).
#
# Фронтенд отдаётся статикой из frontend-dist, /api/* проксируется на
# бэкенд (uvicorn на 127.0.0.1:8000) с тем же префиксом, что использует
# vite в dev-режиме (frontend делает fetch("/api/...")).

server {
    listen 80 default_server;
    server_name _;

    root __INSTALL_DIR__/frontend-dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Дефолт nginx (60с) короче, чем реально идёт ручной запуск
        # синхронизации на большом штате (обход по одному сотруднику/
        # табельному номеру за раз, см. sync_service.py/vacation_days.py) —
        # без этого nginx обрывает соединение раньше, чем бэкенд успевает
        # ответить, хотя сама синхронизация на сервере продолжается и
        # завершается успешно уже после того, как клиент увидел ошибку.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # SPA: неизвестные пути отдаём index.html, роутинг на стороне React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
